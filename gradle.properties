# 4 GB heap: R8 full-mode release shrinking OOM'd at the old 2 GB once the
# platform batch added the ads/play SDKs (AppLovin, Unity, AdMob, FCM,
# Play Integrity — CI run 39239164697, :app:minifyReleaseWithR8 Java heap
# space). MaxMetaspace guards the worker's class metadata separately.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
