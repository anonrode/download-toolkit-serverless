name: OTA Rules Pipeline

# Validates the COMMITTED signed payload on every rules change.
#
# Design: the plaintext scraper_rules.json is deliberately NEVER committed
# (secrecy — site owners watching the repo must not read the selectors), so
# CI cannot regenerate the payload. Signing happens on the maintainer's
# machine (scripts/encrypt_rules.py + the local keypair in
# ~/anon-serverless-app-maintenance-build/, outside both repos); this
# workflow is the safety gate that proves the committed .enc is authentic
# (ECDSA) and schema-valid BEFORE any app can sync it.
#
# Also runs on workflow_dispatch so a fresh validate can be triggered
# manually at any time.

on:
  push:
    branches: [master, main]
    paths:
      - 'scraper_rules.json.enc'
      - 'scripts/encrypt_rules.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cryptography
        run: pip install cryptography

      - name: Verify signature, decrypt and schema-check the payload
        run: |
          python - <<'EOF'
          import sys, json
          sys.path.insert(0, 'scripts')
          import encrypt_rules as ota

          env_text = open('scraper_rules.json.enc', encoding='utf-8').read()
          ota.verify_envelope(env_text)                     # exit 1 if unsigned/tampered
          plain = ota.decrypt_envelope_or_legacy(env_text)
          problems = ota.validate_schema(plain)
          if problems:
              print('SCHEMA VALIDATION FAILED:')
              for p in problems:
                  print('  -', p)
              sys.exit(1)
          rules = json.loads(plain)
          print(f'Payload OK: version={rules.get("version")}, '
                f'signature valid, {len(plain)} bytes plaintext')
          EOF
