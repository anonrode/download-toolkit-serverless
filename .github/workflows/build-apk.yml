# Build Native Android Release APK
#
# Pipeline shape (Phase 3 — emulator gating + flake ledger):
#   1. build            — JVM unit tests (Tier 0) + Robolectric UI tests (Tier 1)
#   2. emulator-test    — instrumented smoke tests (Tier 2) on a real emulator.
#                         First run is the gate. A failure re-runs ONLY the
#                         failing test class once. If the retry passes, the
#                         failure is recorded in flake-ledger.json and the
#                         pipeline continues. If the retry fails, the job fails
#                         and release is blocked.
#   3. release          — Build & publish the release APK. Gated on BOTH build
#                         and emulator-test passing (or flaking).
#
# The "gate" is the contract that `emulator-test` must be green (or a recorded
# flake) for `release` to run. The "ledger" (flake-ledger.json at the repo
# root) is the durable history of every flaky test class, versioned via SHA-1
# fingerprints of the failure signature, with a 14-day pruning window so
# stale flakes don't accumulate.

name: Build Native Android Release APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native APK (Tier 0 + Tier 1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml

  emulator-test:
    name: Emulator Smoke Tests (Tier 2 + ledger)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Grant KVM access (emulator acceleration)
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm

      - name: Run Instrumented Smoke Tests (emulator, first pass)
        # The "gate" lives here: this step must pass on a real Android
        # runtime. We no longer use continue-on-error — emulator is the
        # source of truth for "does master actually run?".
        id: first_run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disable-linux-hw-accel: false
          # `|| true` keeps the step exit code the same as `gradle`'s so
          # the workflow's `failure()` checks still fire on a real test
          # failure. The trailing `adb logcat` dump is best-effort — it
          # runs whether the tests passed or failed so the workflow log
          # always has a tail of the device's recent logs available
          # while debugging. Logcat output is bounded (a few hundred KB
          # on this AVD/API combo) and is harmless on a green run.
          script: |
            gradle :app:connectedDebugAndroidTest --no-daemon || EXIT_CODE=$?
            echo "===== adb logcat (last 200 lines, tag-filtered) ====="
            adb logcat -d -t 200 '*:E' '*:W' 'TestRunner:*' 'AndroidXTracer:*' 'AnonApp:*' 2>&1 || true
            echo "===== end logcat ====="
            exit ${EXIT_CODE:-0}

      - name: Archive first-run JUnit XML
        # Persist the first-run XML outside the emulator runner's tmpfs so
        # the parse and retry steps can read it. Use a job-level path under
        # $GITHUB_WORKSPACE (not /tmp) so it survives step cleanup.
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci-artifacts/first"
          if [ -d app/build/outputs/androidTest-results/connected ]; then
            cp -r app/build/outputs/androidTest-results/connected/. \
              "$GITHUB_WORKSPACE/.ci-artifacts/first/" || true
          fi
          ls -la "$GITHUB_WORKSPACE/.ci-artifacts/first" || true

      - name: Parse first-run JUnit XML for failing classes
        id: parse
        if: always()
        # The python script writes its outputs (failures JSON + has_failures
        # boolean) directly to $GITHUB_OUTPUT. Do NOT also redirect stdout
        # to GITHUB_OUTPUT — that prepends the raw JSON before the heredoc
        # markers and GitHub rejects the file with "Invalid format".
        run: |
          python3 scripts/ci/parse_instrumented_failures.py \
            "$GITHUB_WORKSPACE/.ci-artifacts/first"

      - name: Re-run failing classes once (retry-once)
        # Only runs if the first pass failed AND the parse step produced a
        # non-empty failing_classes list. Re-runs the failing class with
        # AndroidJUnitRunner's `class` argument so the runner scope is
        # bounded to that single class.
        id: retry
        if: failure() && steps.parse.outputs.has_failures == 'true'
        env:
          FAILING_CLASSES: ${{ steps.parse.outputs.failures }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disable-linux-hw-accel: false
          script: |
            set -e
            # FAILING_CLASSES is a JSON line; pull out the array.
            CLASSES=$(python3 -c '
              import json, os, sys
              data = json.loads(os.environ.get("FAILING_CLASSES", "{}"))
              print(" ".join(data.get("failing_classes", [])))
            ')
            echo "Re-running classes: $CLASSES"
            # Reuse the same gradle task with -Pandroid.testInstrumentationRunnerArguments.class=
            # to scope the re-run. The runner supports multiple via repeated
            # `-Pandroid.testInstrumentationRunnerArguments.class=` flags;
            # gradle will pass them through to AndroidJUnitRunner.
            ARGS=""
            for c in $CLASSES; do
              ARGS="$ARGS -Pandroid.testInstrumentationRunnerArguments.class=$c"
            done
            gradle :app:connectedDebugAndroidTest --no-daemon $ARGS \
              || EXIT_CODE=$?
            exit ${EXIT_CODE:-0}

      - name: Archive retry JUnit XML
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci-artifacts/retry"
          if [ -d app/build/outputs/androidTest-results/connected ]; then
            cp -r app/build/outputs/androidTest-results/connected/. \
              "$GITHUB_WORKSPACE/.ci-artifacts/retry/" || true
          fi
          ls -la "$GITHUB_WORKSPACE/.ci-artifacts/retry" || true

      - name: Decide gate outcome + update flake ledger
        id: ledger
        if: always()
        env:
          # First-run outcome: did `first_run` succeed? If it did, no
          # retries happen, so the gate is just "passed" — the ledger step
          # is a no-op.
          FIRST_OUTCOME: ${{ steps.first_run.outcome }}
          RETRY_OUTCOME: ${{ steps.retry.outcome }}
        run: |
          set -uo pipefail
          if [ "$FIRST_OUTCOME" = "success" ]; then
            echo "First run passed — no ledger update needed."
            echo "gate=passed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # First run failed. Did the retry run? If RETRY_OUTCOME is
          # "success" we flaked; if it is anything else (failure, skipped,
          # cancelled) we treat it as a real failure.
          if [ "$RETRY_OUTCOME" = "success" ]; then
            echo "First run failed, retry passed — recording flake."
            python3 scripts/ci/update_flake_ledger.py \
              flake-ledger.json \
              "$GITHUB_WORKSPACE/.ci-artifacts/first" \
              flaked \
              "$GITHUB_WORKSPACE/.ci-artifacts/first"
            echo "gate=flaked" >> "$GITHUB_OUTPUT"
          else
            echo "First run failed, retry also failed — recording failure."
            python3 scripts/ci/update_flake_ledger.py \
              flake-ledger.json \
              "$GITHUB_WORKSPACE/.ci-artifacts/retry" \
              failed
            echo "gate=failed" >> "$GITHUB_OUTPUT"
            # Re-fail the step so release is blocked.
            exit 1
          fi

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            .ci-artifacts/

      - name: Upload updated flake-ledger.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-ledger
          path: flake-ledger.json

  release:
    # Gated on BOTH build (unit + Robolectric) AND emulator-test (instrumented
    # + ledger). emulator-test only fails the pipeline when a real failure is
    # recorded; flakes (retry passed) let release proceed. PRs only run the
    # gating steps (build + emulator-test) for the merge check — the
    # APK-assemble step is too heavy and unnecessary for every PR.
    name: Build & Release APK
    runs-on: ubuntu-latest
    needs: [build, emulator-test]
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Prepare release signing key
        # Decodes the release keystore from the GitHub secret and exports
        # the signing env vars for gradle. When the secret is unset (fork
        # builds, local runs), the gradle config falls back to debug
        # signing so the build never breaks.
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/anon-release.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/anon-release.p12" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=release" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Release signing key prepared ($(wc -c < "$RUNNER_TEMP/anon-release.p12") bytes)."
          else
            echo "ANDROID_KEYSTORE_B64 not set — release will be debug-signed."
          fi
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release APKs
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Rename APKs to human-friendly names
        # Default Gradle split naming is app-<abi>-release.apk (e.g.
        # app-arm64-v8a-release.apk). Rename to AnonDownloader-<version>-<abi>.apk
        # so GitHub artifact/release downloads are self-explanatory. <version>
        # is the git ref (v3.0.2 on tags, branch name on branch pushes).
        run: |
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f")
            abi="${base#app-}"
            abi="${abi%-release.apk}"
            mv "$f" "app/build/outputs/apk/release/AnonDownloader-${{ github.ref_name }}-${abi}.apk"
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Anonrode-Downloader-Serverless-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        # Only on version tags (v*): publish the APK under THAT tag name.
        # Branch pushes keep building the APK as a CI artifact without
        # clobbering releases (the old step hardcoded v3.0.0 and overwrote
        # it on every push — why only v3.0.0 ever showed in Releases).
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Anon Downloader ${{ github.ref_name }} (Serverless 100% On-Device Edition)"
          body: |
            ## Anon Downloader — Serverless ${{ github.ref_name }}

            100% on-device drama scraping, episode search, stream resolution, and 16-socket parallel downloads directly on Android.

            - **No VPS, No API Keys**: Scrapes and resolves NKiri, DramaKey, Pluto, 9jaRocks, Anitaku, and DramaRain locally with Jsoup.
            - **Fast Resumable Downloads**: Direct CDN downloads run on aria2c with 16 parallel sockets; file lockers use 1-socket protection.
            - **Signed OTA Rules**: The scraping playbook ships encrypted + ECDSA-signed; tampered payloads are refused on-device.
            - **Torrent Security Shield**: 7 layers incl. Android-executable blocking, PK/archive magic rejection, pre-enqueue validation.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
