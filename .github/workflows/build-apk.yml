name: Build Native Android Release APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml

  emulator-test:
    name: Emulator Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Grant KVM access (emulator acceleration)
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm

      - name: Run Instrumented Smoke Tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        # Report-only: emulator flakiness must never block the APK. The
        # release job below does not depend on this job.
        continue-on-error: true
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disable-linux-hw-accel: false
          script: gradle :app:connectedDebugAndroidTest --no-daemon

      - name: Upload Instrumented Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  release:
    # Independent of emulator-test on purpose: the APK must ship even when
    # the CI-hosted emulator flakes. Only the unit-test job gates it.
    name: Build & Release APK
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Build Release APKs
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Anonrode-Downloader-Serverless-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: "Anon Downloader v3.0.0 (Serverless 100% On-Device Edition)"
          body: |
            ## Anon Downloader — Serverless v3.0.0
            
            100% on-device drama scraping, episode search, stream resolution, and 16-socket parallel downloads directly on Android.
            
            - **No VPS, No API Keys**: Scrapes and resolves NKiri, DramaKey, Pluto, 9jaRocks, Anitaku, and DramaRain locally with Jsoup.
            - **Fast Resumable Downloads**: Direct CDN downloads run on aria2c with 16 parallel sockets; file lockers use 1-socket protection.
            - **Pure OLED Pitch-Black UI**: AMOLED seal aesthetic with zero electric blue.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
