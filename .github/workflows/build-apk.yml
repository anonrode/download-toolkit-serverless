name: Build Native Android Release APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml

  emulator-test:
    name: Emulator Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Grant KVM access (emulator acceleration)
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm

      - name: Run Instrumented Smoke Tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        # Report-only: emulator flakiness must never block the APK. The
        # release job below does not depend on this job.
        continue-on-error: true
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disable-linux-hw-accel: false
          script: gradle :app:connectedDebugAndroidTest --no-daemon

      - name: Upload Instrumented Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  release:
    # Independent of emulator-test on purpose: the APK must ship even when
    # the CI-hosted emulator flakes. Only the unit-test job gates it.
    name: Build & Release APK
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Build Release APKs
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Rename APKs to human-friendly names
        # Default Gradle split naming is app-<abi>-release.apk (e.g.
        # app-arm64-v8a-release.apk). Rename to AnonDownloader-<version>-<abi>.apk
        # so GitHub artifact/release downloads are self-explanatory. <version>
        # is the git ref (v3.0.2 on tags, branch name on branch pushes).
        run: |
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f")
            abi="${base#app-}"
            abi="${abi%-release.apk}"
            mv "$f" "app/build/outputs/apk/release/AnonDownloader-${{ github.ref_name }}-${abi}.apk"
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Anonrode-Downloader-Serverless-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        # Only on version tags (v*): publish the APK under THAT tag name.
        # Branch pushes keep building the APK as a CI artifact without
        # clobbering releases (the old step hardcoded v3.0.0 and overwrote
        # it on every push — why only v3.0.0 ever showed in Releases).
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Anon Downloader ${{ github.ref_name }} (Serverless 100% On-Device Edition)"
          body: |
            ## Anon Downloader — Serverless ${{ github.ref_name }}

            100% on-device drama scraping, episode search, stream resolution, and 16-socket parallel downloads directly on Android.

            - **No VPS, No API Keys**: Scrapes and resolves NKiri, DramaKey, Pluto, 9jaRocks, Anitaku, and DramaRain locally with Jsoup.
            - **Fast Resumable Downloads**: Direct CDN downloads run on aria2c with 16 parallel sockets; file lockers use 1-socket protection.
            - **Signed OTA Rules**: The scraping playbook ships encrypted + ECDSA-signed; tampered payloads are refused on-device.
            - **Torrent Security Shield**: 7 layers incl. Android-executable blocking, PK/archive magic rejection, pre-enqueue validation.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
